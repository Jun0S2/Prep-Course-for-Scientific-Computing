<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Step-by-Step LU + Solve Ax=b Visualizer</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; background:#f4f4f4; }
.screen { display: none; }
.flex-row { display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-start; }
table { border-collapse: collapse; }
td { border: 1px solid #666; width: 60px; height: 60px; text-align: center; font-size: 20px; font-weight:bold; }
.filled { background-color: #fff; }       /* 완료 */
.updating { background-color: #ff6961; }    /* 현재 */
.fixed { background-color: #fff; }       /* 고정값 (변하지 않음) */
td.empty { background-color: #fff; }        /* 아직 채우지 않음 */
button { margin:5px; padding:10px 16px; font-size:18px; cursor:pointer; }
.desc { margin-top:10px; font-size:20px; color:#333; background:#fff8dc; padding:12px; border-radius:5px; }
.desc .title { font-size:22px; font-weight:bold; margin-bottom:6px; display:block; }
</style>
</head>
<body>

<h2>Step-by-Step LU Factorization + Solve Ax=b</h2>

<!-- Main Screen -->
<div id="mainScreen" class="screen" style="display:block;">
  <button onclick="startScreen('LU')">LU Factorization Only</button>
  <button onclick="startScreen('Solve')">Solve Ax=b</button>
</div>

<!-- LU Only Screen -->
<div id="LUScreen" class="screen">
  <h3>LU Factorization Step-by-Step</h3>
  <label>N = <input type="number" id="matrixSizeLU" value="3" min="2" max="6"></label>
  <button onclick="generateLU()">Generate Matrix</button>
  
  <div class="flex-row">
    <div><h4>Matrix A</h4><div id="matrixA_LU"></div></div>
    <div><h4>Lower L</h4><div id="matrixL_LU"></div></div>
    <div><h4>Upper U</h4><div id="matrixU_LU"></div></div>
  </div>
  
  <button onclick="nextStepLU()">Next Step</button>
  <div id="descLU" class="desc"></div>
</div>

<!-- Solve Ax=b Screen -->
<div id="SolveScreen" class="screen">
  <h3>LU Factorization + Solve Ax=b</h3>
  <label>N = <input type="number" id="matrixSizeSolve" value="3" min="2" max="6"></label>
  <button onclick="generateSolve()">Generate Matrix & b</button>

  <div class="flex-row">
    <div><h4>Matrix A</h4><div id="matrixA_Solve"></div></div>
    <div><h4>Vector b</h4><div id="vectorB_Solve"></div></div>
  </div>

  <div class="flex-row">
    <div><h4>Lower L</h4><div id="matrixL_Solve"></div></div>
    <div><h4>Upper U</h4><div id="matrixU_Solve"></div></div>
  </div>

  <div class="flex-row">
    <div><h4>Vector y (Ly=b)</h4><div id="vectorY_Solve"></div></div>
    <div><h4>Vector x (Ux=y)</h4><div id="vectorX_Solve"></div></div>
  </div>

  <button onclick="nextStepSolve()">Next Step</button>
  <div id="descSolve" class="desc"></div>
</div>

<script>
let N=3, A=[], L=[], U=[], b=[], y=[], x=[];
let step=0, phase='LU', currentCol=0, currentRow=1;

// --- Main ---
function startScreen(opt){
  document.getElementById("mainScreen").style.display='none';
  if(opt==='LU') document.getElementById("LUScreen").style.display='block';
  else document.getElementById("SolveScreen").style.display='block';
}

// --- Table ---
function createTable(matrix, highlight=[], isVector=false, matrixType=''){
  let html="<table>";
  for(let i=0;i<matrix.length;i++){
    html+="<tr>";
    for(let j=0;j<(isVector?1:matrix[i].length);j++){
      let val = matrix[i][j];
      let cls = "empty";
      
      if(highlight.some(p=>p[0]===i && p[1]===j)) {
        cls = "updating";
      } else if (matrixType === 'L') {
        // L의 대각선 1과 오른쪽 위 삼각형은 고정값
        if (i === j && val === 1) cls = "fixed";
        else if (j > i && val === 0) cls = "fixed";
        else if (val !== '' && !isNaN(val)) cls = "filled";
      } else if (matrixType === 'U') {
        // U의 첫 줄은 고정값
        if (i === 0 && val !== '' && !isNaN(val)) cls = "fixed";
        else if (val !== '' && !isNaN(val)) cls = "filled";
      } else if(val !== '' && !isNaN(val)) {
        cls = "filled";
      }
      
      html+=`<td class="${cls}">${val}</td>`;
    }
    html+="</tr>";
  }
  html+="</table>";
  return html;
}

// ================= LU Only =================
function generateLU(){
  N=parseInt(document.getElementById("matrixSizeLU").value);
  A=[]; L=[]; U=[]; step=0; currentCol=0; currentRow=1; phase='LU';
  
  // A 생성 (원래대로)
  for(let i=0;i<N;i++){ 
    A[i]=[]; 
    L[i]=[]; 
    U[i]=[];
    for(let j=0;j<N;j++){
      let val=Math.floor(Math.random()*10)+1;
      A[i][j]=val; 
      U[i][j]=val; // U는 A로 초기화 (원래대로)
      
      // L 초기화: 대각선 1, 오른쪽 위 0, 나머지 빈칸
      if(i === j) L[i][j] = 1;
      else if(j > i) L[i][j] = 0;
      else L[i][j] = '';
    }
  }
  
  updateDisplayLU();
  document.getElementById("descLU").innerHTML="<span class='title'>Initialization</span>L: diagonal=1, upper triangle=0. U = A";
}

function updateDisplayLU(highlight=[]){
  document.getElementById("matrixA_LU").innerHTML=createTable(A);
  document.getElementById("matrixL_LU").innerHTML=createTable(L, highlight, false, 'L');
  document.getElementById("matrixU_LU").innerHTML=createTable(U, highlight, false, 'U');
}

function nextStepLU(){
  if(currentCol>=N-1){ 
    document.getElementById("descLU").innerHTML="<span class='title'>LU Completed!</span> All multipliers applied."; 
    return; 
  }
  
  // multiplier 계산
  let mult = (U[currentRow][currentCol] / U[currentCol][currentCol]).toFixed(2);
  
  // L 업데이트
  L[currentRow][currentCol] = parseFloat(mult);
  
  // U 업데이트
  let highlight = [[currentRow, currentCol]]; // L의 현재 위치
  for(let j=currentCol;j<N;j++){
    U[currentRow][j] = (U[currentRow][j] - mult * U[currentCol][j]).toFixed(2);
    if(j >= currentCol) highlight.push([currentRow, j]); // U의 업데이트 위치
  }
  
  updateDisplayLU(highlight);
  
  // 설명
  document.getElementById("descLU").innerHTML=
    `<span class='title'>Step: Column ${currentCol}, Row ${currentRow}</span>
     L[${currentRow},${currentCol}] = ${mult} <br>
     <b>Update row ${currentRow} of U:</b> <br>
     U[${currentRow},:] = U[${currentRow},:] - ${mult} × U[${currentCol},:]`;
  
  // 다음 스텝
  currentRow++;
  if(currentRow>=N){ 
    currentCol++; 
    currentRow=currentCol+1; 
  }
}

// ================= Solve Ax=b =================
function generateSolve(){
  N=parseInt(document.getElementById("matrixSizeSolve").value);
  A=[]; L=[]; U=[]; b=[]; y=Array(N).fill(''); x=Array(N).fill('');
  step=0; phase='LU'; currentCol=0; currentRow=1;
  
  // A와 b 생성 (원래대로)
  for(let i=0;i<N;i++){ 
    A[i]=[]; 
    L[i]=[]; 
    U[i]=[]; 
    b[i]=Math.floor(Math.random()*10)+1;
    for(let j=0;j<N;j++){
      let val=Math.floor(Math.random()*10)+1;
      A[i][j]=val; 
      U[i][j]=val; // U는 A로 초기화 (원래대로)
      
      // L 초기화: 대각선 1, 오른쪽 위 0, 나머지 빈칸
      if(i === j) L[i][j] = 1;
      else if(j > i) L[i][j] = 0;
      else L[i][j] = '';
    }
  }
  
  updateDisplaySolve();
  document.getElementById("descSolve").innerHTML="<span class='title'>Initialization</span>L: diagonal=1, upper triangle=0. U = A. Random b.";
}

function updateDisplaySolve(highlight=[]){
  document.getElementById("matrixA_Solve").innerHTML=createTable(A);
  document.getElementById("matrixL_Solve").innerHTML=createTable(L, highlight, false, 'L');
  document.getElementById("matrixU_Solve").innerHTML=createTable(U, highlight, false, 'U');
  document.getElementById("vectorB_Solve").innerHTML=createTable(b.map(v=>[v]),[],true);
  document.getElementById("vectorY_Solve").innerHTML=createTable(y.map(v=>[v]),[],true);
  document.getElementById("vectorX_Solve").innerHTML=createTable(x.map(v=>[v]),[],true);
}

function nextStepSolve(){
  if(phase==='LU'){
    if(currentCol>=N-1){ 
      phase='Forward'; 
      step=0; 
      document.getElementById("descSolve").innerHTML="<span class='title'>LU Completed</span> Start Forward Substitution"; 
      return; 
    }
    
    let mult = (U[currentRow][currentCol] / U[currentCol][currentCol]).toFixed(2);
    let highlight = [[currentRow, currentCol]];
    
    for(let j=currentCol;j<N;j++){
      U[currentRow][j] = (U[currentRow][j] - mult * U[currentCol][j]).toFixed(2);
      highlight.push([currentRow, j]);
    }
    
    L[currentRow][currentCol] = parseFloat(mult);
    updateDisplaySolve(highlight);
    
    document.getElementById("descSolve").innerHTML=
      `<span class='title'>Step: LU, Column ${currentCol}, Row ${currentRow}</span>
       L[${currentRow},${currentCol}] = ${mult} <br>
       <b>Update row ${currentRow} of U:</b><br>
       U[${currentRow},:] = U[${currentRow},:] - ${mult} × U[${currentCol},:]`;
    
    currentRow++; 
    if(currentRow>=N){ 
      currentCol++; 
      currentRow=currentCol+1; 
    }
  }
  else if(phase==='Forward'){
    if(step>=N){ 
      phase='Backward'; 
      step=0; 
      document.getElementById("descSolve").innerHTML="<span class='title'>Forward Completed</span> Start Backward Substitution"; 
      return; 
    }
    let i=step, sum=0;
    for(let j=0;j<i;j++) sum += L[i][j] * y[j];
    y[i] = (b[i] - sum).toFixed(2);
    updateDisplaySolve([[i,0]]);
    document.getElementById("descSolve").innerHTML=
      `<span class='title'>Forward Substitution: Compute y[${i}]</span><br>
       y[${i}] = b[${i}] - Σ L[${i},j]*y[j] = ${b[i]} - ${sum} = ${y[i]}`;
    step++;
  }
  else if(phase==='Backward'){
    if(step>=N){ 
      document.getElementById("descSolve").innerHTML="<span class='title'>Backward Completed</span> Solution x obtained!"; 
      return; 
    }
    let i=N-1-step, sum=0;
    for(let j=i+1;j<N;j++) sum += U[i][j] * x[j];
    x[i] = ((y[i] - sum) / U[i][i]).toFixed(2);
    updateDisplaySolve([[i,0]]);
    document.getElementById("descSolve").innerHTML=
      `<span class='title'>Backward Substitution: Compute x[${i}]</span><br>
       x[${i}] = (y[${i}] - Σ U[${i},j]*x[j])/U[${i},${i}] = (${y[i]} - ${sum})/${U[i][i]} = ${x[i]}`;
    step++;
  }
}
</script>
</body>
</html>
